[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5174
  port = 8888
  framework = "#custom"

# Clean URL aliases from the previous static site.
[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/hive.html"
  to = "/rankings"
  status = 301

[[redirects]]
  from = "/hive"
  to = "/rankings"
  status = 301

[[redirects]]
  from = "/apps"
  to = "/rankings"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/rankings"
  status = 301

[[redirects]]
  from = "/the-buzz"
  to = "/buzz"
  status = 301

[[redirects]]
  from = "/swarm"
  to = "/about"
  status = 302

# Force unique HTML documents. A Netlify SPA 200 rewrite to /index.html
# is what made /, /about, and /buzz byte-identical on the live site.
[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/about/"
  to = "/about/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/buzz"
  to = "/buzz/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/buzz/"
  to = "/buzz/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/rankings"
  to = "/rankings/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/rankings/"
  to = "/rankings/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/build"
  to = "/build/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/build/"
  to = "/build/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/consult"
  to = "/consult/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/consult/"
  to = "/consult/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/concierge"
  to = "/concierge/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/concierge/"
  to = "/concierge/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/disclosure"
  to = "/disclosure/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/disclosure/"
  to = "/disclosure/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/x"
  to = "/x/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/x/"
  to = "/x/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ads/thanks"
  to = "/ads/thanks/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/ads/thanks/"
  to = "/ads/thanks/index.html"
  status = 200
  force = true

# /ads sold the $297 Ad Sprint. That payment link is inactive; send
# visitors to the /consult sprint page (B2B reset 2026-11-24).
# Leave /ads/thanks, /ads/creative-calculator/, and /ads/ai-video-ads-for-shopify/ alone.
# /ads/index.html is a leftover static file and was still 200 with $997/$297 links.
# 301 it to /ads (which then 302s to /consult). force=true so a leftover
# published file cannot win. This is not a loop: /ads/index.html -> /ads -> /consult.
[[redirects]]
  from = "/ads/index.html"
  to = "/ads"
  status = 301
  force = true

[[redirects]]
  from = "/ads"
  to = "/consult"
  status = 302
  force = true

[[redirects]]
  from = "/ads/"
  to = "/consult"
  status = 302
  force = true

[[redirects]]
  from = "/consult/north-star-ai-consultation-alternative"
  to = "/consult"
  status = 301

[[redirects]]
  from = "/consult/north-star-ai-consultation-alternative/"
  to = "/consult"
  status = 301

# /audit lands on the $2,500 sprint page (B2B reset 2026-11-24).
[[redirects]]
  from = "/audit"
  to = "/consult"
  status = 301

[[redirects]]
  from = "/audit/"
  to = "/consult"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fd-brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/40602f6b-ecf3-406b-a8e5-2e9f601462b6.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/4f4286e18692cde11b1e47a38c8478d8.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/x/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
