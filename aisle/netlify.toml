[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5178
  port = 8892
  framework = "#custom"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/build"
  to = "/build/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/build/"
  to = "/build/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/brown-wool"
  to = "/shop/brown-wool/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/brown-wool/"
  to = "/shop/brown-wool/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/flange-tube"
  to = "/shop/flange-tube/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/shop/flange-tube/"
  to = "/shop/flange-tube/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/publish"
  to = "/publish/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/publish/"
  to = "/publish/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/door"
  to = "/door/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/door/"
  to = "/door/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/thanks"
  to = "/thanks/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/thanks/"
  to = "/thanks/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
