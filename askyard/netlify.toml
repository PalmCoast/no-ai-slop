[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5176
  port = 8890
  framework = "#custom"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/about/"
  to = "/about/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/board"
  to = "/board/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/board/"
  to = "/board/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/apps"
  to = "/apps/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/apps/"
  to = "/apps/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/hunt"
  to = "/hunt/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/hunt/"
  to = "/hunt/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/launch"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/launch/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/rep"
  to = "/rep/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/rep/"
  to = "/rep/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/marquee"
  to = "/marquee/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/marquee/"
  to = "/marquee/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/marquee/thanks"
  to = "/marquee/thanks/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/marquee/thanks/"
  to = "/marquee/thanks/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/q/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/40602f6b-ecf3-406b-a8e5-2e9f601462b6.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/api/rep"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"

[[edge_functions]]
  function = "marquee-host"
  path = "/*"
