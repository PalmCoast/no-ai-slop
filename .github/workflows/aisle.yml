name: aisle

on:
  pull_request:
    paths:
      - "aisle/**"
      - ".github/workflows/aisle.yml"
  push:
    branches: [main]
    paths:
      - "aisle/**"
      - ".github/workflows/aisle.yml"

jobs:
  test:
    name: test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aisle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aisle/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
