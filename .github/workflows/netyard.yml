name: netyard

on:
  pull_request:
    paths:
      - "netyard/**"
      - ".github/workflows/netyard.yml"
  push:
    branches: [main]
    paths:
      - "netyard/**"
      - ".github/workflows/netyard.yml"

jobs:
  test:
    name: test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netyard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: netyard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
