[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5177
  port = 8891
  framework = "#custom"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/plan"
  to = "/plan/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/plan/"
  to = "/plan/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/tools"
  to = "/tools/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/tools/"
  to = "/tools/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/compare"
  to = "/compare/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/compare/"
  to = "/compare/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/buy"
  to = "/buy/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/buy/"
  to = "/buy/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/launch"
  to = "/launch/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/launch/"
  to = "/launch/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/thanks"
  to = "/thanks/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/thanks/"
  to = "/thanks/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/launch/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
